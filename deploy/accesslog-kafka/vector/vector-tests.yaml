# Unit tests for the access log parser. Run with:
#   JFS_VECTOR_DIR=$PWD KAFKA_BOOTSTRAP=localhost:9092 vector test vector.yaml vector-tests.yaml
tests:
  - name: create with comma and CJK in name
    inputs:
      - insert_at: jfs_accesslog_parsed
        type: log
        log_fields:
          message: "/jfs\t2026.10.22 14:51:42.688249 [uid:0,gid:0,pid:8358] create (50,报告,v1.txt,-rw-r--r--:0100644): (54,[-rw-r--r--:0100644,1,0,0,1792680702,1792680702,1792680702,0]) [fh:244] - OK <0.000158>"
    outputs:
      - extract_from: jfs_accesslog_parsed
        conditions:
          - type: vrl
            source: |
              assert_eq!(.op, "create")
              assert_eq!(.mountpoint, "/jfs")
              assert_eq!(.parent_inode, 50)
              assert_eq!(.name, "报告,v1.txt")
              assert_eq!(.inode, 54)
              assert_eq!(.fh, 244)
              assert_eq!(.mode, "0100644")
              assert_eq!(.duration_us, 158)
              assert_eq!(.ok, true)
              assert_eq!(.timestamp, t'2026-10-22T14:51:42.688249Z')

  - name: read returns bytes actually read
    inputs:
      - insert_at: jfs_accesslog_parsed
        type: log
        log_fields:
          message: "/jfs\t2026.10.22 14:45:37.717576 [uid:1000,gid:1000,pid:6751] read (4,4096,0,11): (6) - OK <0.000166>"
    outputs:
      - extract_from: jfs_accesslog_parsed
        conditions:
          - type: vrl
            source: |
              assert_eq!(.op, "read")
              assert_eq!(.inode, 4)
              assert_eq!(.fh, 11)
              assert_eq!(.offset, 0)
              assert_eq!(.bytes, 6)
              assert_eq!(.uid, 1000)

  - name: write
    inputs:
      - insert_at: jfs_accesslog_parsed
        type: log
        log_fields:
          message: "/jfs\t2026.10.22 14:45:37.696327 [uid:0,gid:0,pid:6748] write (5,131072,131072,10) - OK <0.000064>"
    outputs:
      - extract_from: jfs_accesslog_parsed
        conditions:
          - type: vrl
            source: |
              assert_eq!(.op, "write")
              assert_eq!(.inode, 5)
              assert_eq!(.bytes, 131072)
              assert_eq!(.offset, 131072)
              assert_eq!(.fh, 10)

  - name: failed lookup
    inputs:
      - insert_at: jfs_accesslog_parsed
        type: log
        log_fields:
          message: "/jfs\t2026.10.22 14:45:37.688824 [uid:0,gid:0,pid:6747] lookup (1,d1): - no such file or directory <0.000207>"
    outputs:
      - extract_from: jfs_accesslog_parsed
        conditions:
          - type: vrl
            source: |
              assert_eq!(.op, "lookup")
              assert_eq!(.ok, false)
              assert_eq!(.status, "no such file or directory")
              assert_eq!(.parent_inode, 1)
              assert_eq!(.name, "d1")
              assert!(!exists(.inode))

  - name: rename
    inputs:
      - insert_at: jfs_accesslog_parsed
        type: log
        log_fields:
          message: "/jfs\t2026.10.22 14:45:37.721173 [uid:0,gid:0,pid:6753] rename (2,a.txt,3,b.txt,1) - OK <0.000270>"
    outputs:
      - extract_from: jfs_accesslog_parsed
        conditions:
          - type: vrl
            source: |
              assert_eq!(.parent_inode, 2)
              assert_eq!(.name, "a.txt")
              assert_eq!(.new_parent_inode, 3)
              assert_eq!(.new_name, "b.txt")

  - name: setattr truncate
    inputs:
      - insert_at: jfs_accesslog_parsed
        type: log
        log_fields:
          message: "/jfs\t2026.10.22 14:45:37.725094 [uid:0,gid:0,pid:6757] setattr (5[14],0x248,[size=1048576]): (5,[-rw-------:0100600,1,0,0,1792680337,1792680337,1792680337,1048576]) - OK <0.000151>"
    outputs:
      - extract_from: jfs_accesslog_parsed
        conditions:
          - type: vrl
            source: |
              assert_eq!(.op, "setattr")
              assert_eq!(.inode, 5)
              assert_eq!(.fh, 14)
              assert_eq!(.file_size, 1048576)

  - name: internal inode is filtered out
    inputs:
      - insert_at: jfs_accesslog_parsed
        type: log
        log_fields:
          message: "/jfs\t2026.10.22 14:45:36.687997 [uid:0,gid:0,pid:6741] open (9223372032559808513,0x8000) [fh:5] - OK <0.000016>"
    no_outputs_from:
      - jfs_accesslog_filtered

  - name: malformed line goes to dropped output
    inputs:
      - insert_at: jfs_accesslog_parsed
        type: log
        log_fields:
          message: "/jfs\tthis is not an access log line"
    outputs:
      - extract_from: jfs_accesslog_parsed.dropped
        conditions:
          - type: vrl
            source: |
              assert_eq!(.message, "/jfs\tthis is not an access log line")
              assert_eq!(.metadata.dropped.reason, "abort")
