# Vector pipeline: JuiceFS FUSE ".accesslog" -> parse -> (aggregate read/write) -> Kafka
#
# Environment variables:
#   KAFKA_BOOTSTRAP     Kafka bootstrap servers, e.g. 172.30.0.2:9092
#   KAFKA_TOPIC         access log topic (default juicefs-accesslog)
#   JUICEFS_TZ          time zone of the juicefs process, used to parse log timestamps
#   JFS_CLUSTER         free-form label of the cluster / environment
#   VECTOR_SELF_NODE_NAME  node name (set via the downward API on Kubernetes)
#   JFS_KEEP_RAW        "true" to keep the original line in .raw (default false)
#   MOUNT_PREFIXES      optional, see juicefs-accesslog-reader.sh
#   JFS_VECTOR_DIR      directory holding the reader script and VRL file (default /etc/vector)
data_dir: /var/lib/vector

api:
  enabled: true
  address: 0.0.0.0:8686

sources:
  jfs_accesslog_raw:
    type: exec
    mode: streaming
    command: ["${JFS_VECTOR_DIR:-/etc/vector}/juicefs-accesslog-reader.sh"]
    include_stderr: false
    streaming:
      respawn_on_exit: true
      respawn_interval_secs: 5
    decoding:
      codec: bytes
    framing:
      method: newline_delimited
      newline_delimited:
        max_length: 65536

  vector_metrics:
    type: internal_metrics

transforms:
  jfs_accesslog_parsed:
    type: remap
    inputs: [jfs_accesslog_raw]
    file: "${JFS_VECTOR_DIR:-/etc/vector}/parse_accesslog.vrl"
    drop_on_error: true
    drop_on_abort: true
    reroute_dropped: true

  jfs_accesslog_enriched:
    type: remap
    inputs: [jfs_accesslog_parsed]
    source: |
      .hostname = get_env_var("VECTOR_SELF_NODE_NAME") ?? get_hostname!()
      .cluster = get_env_var("JFS_CLUSTER") ?? "default"
      .count = 1
      del(.host)
      if (get_env_var("JFS_KEEP_RAW") ?? "false") != "true" { del(.raw) }
      # CSI mount pod mount points: /var/lib/juicefs/volume/<pv-name>-<random>
      csi = parse_regex(.mountpoint, r'^/var/lib/juicefs/volume/(?P<pv>.+)-[a-z0-9]{6}$') ?? {}
      if csi.pv != null { .pv = csi.pv }

  # Drop operations on JuiceFS internal files (.accesslog/.control/.stats/.config/.trash),
  # i.e. inodes >= 0x7FFFFFFF00000000, generated by the reader itself and by juicefs CLI.
  jfs_accesslog_filtered:
    type: filter
    inputs: [jfs_accesslog_enriched]
    condition: '!exists(.inode) || .inode == null || to_int!(.inode) < 9223372032559808512'

  jfs_accesslog_route:
    type: route
    inputs: [jfs_accesslog_filtered]
    route:
      io: 'includes(["read", "write"], .op) && .ok == true'

  # Sequential I/O produces one record per FUSE request (<=128 KiB); merge them per
  # open file handle to cut Kafka volume by orders of magnitude. To ship every single
  # read/write record instead, feed jfs_accesslog_route.io directly into jfs_accesslog_final.
  jfs_accesslog_io_agg:
    type: reduce
    inputs: [jfs_accesslog_route.io]
    group_by: [hostname, mountpoint, op, inode, fh, pid, uid]
    expire_after_ms: 5000
    flush_period_ms: 1000
    max_events: 10000
    # numeric fields are summed by default; keep the identity fields as-is
    merge_strategies:
      count: sum
      bytes: sum
      duration_us: sum
      offset: min
      inode: discard
      fh: discard
      pid: discard
      uid: discard
      gid: discard
      ts_ingest: retain

  jfs_accesslog_io_agg_fmt:
    type: remap
    inputs: [jfs_accesslog_io_agg]
    source: |
      .aggregated = true
      .timestamp = .timestamp_end
      del(.timestamp_end)
      del(.raw)
      del(.args)
      del(.result)

  jfs_accesslog_final:
    type: remap
    inputs: [jfs_accesslog_route._unmatched, jfs_accesslog_io_agg_fmt]
    source: |
      if !exists(.aggregated) { .aggregated = false }

sinks:
  kafka_accesslog:
    type: kafka
    inputs: [jfs_accesslog_final]
    bootstrap_servers: "${KAFKA_BOOTSTRAP}"
    topic: "${KAFKA_TOPIC:-juicefs-accesslog}"
    key_field: inode
    compression: lz4
    encoding:
      codec: json
      timestamp_format: rfc3339
    acknowledgements:
      enabled: false
    buffer:
      type: disk
      max_size: 1073741824
      when_full: drop_newest
    librdkafka_options:
      "linger.ms": "100"
      "batch.num.messages": "10000"

  kafka_accesslog_dlq:
    type: kafka
    inputs: [jfs_accesslog_parsed.dropped]
    bootstrap_servers: "${KAFKA_BOOTSTRAP}"
    topic: "${KAFKA_TOPIC:-juicefs-accesslog}-dlq"
    encoding:
      codec: json

  prometheus:
    type: prometheus_exporter
    inputs: [vector_metrics]
    address: 0.0.0.0:9598
