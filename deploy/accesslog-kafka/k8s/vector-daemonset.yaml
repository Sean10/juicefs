# Collect the access log of every JuiceFS CSI mount pod on the node.
#
# Mount pods mount the volume on the host at /var/lib/juicefs/volume/<pv>-<random>
# (Bidirectional propagation). The reader container sees them through a HostToContainer
# hostPath, reads "<mount>/.accesslog" directly (no change to mount pods or apps) and sends
# JSON lines to Vector over a unix socket in a shared emptyDir. Both images are official
# upstream images; the code comes from the ConfigMaps generated by ../kustomization.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: juicefs-logging
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector-juicefs
  namespace: juicefs-logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector-juicefs
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector-juicefs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector-juicefs
subjects:
  - kind: ServiceAccount
    name: vector-juicefs
    namespace: juicefs-logging
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector-juicefs-accesslog
  namespace: juicefs-logging
  labels:
    app: vector-juicefs-accesslog
spec:
  selector:
    matchLabels:
      app: vector-juicefs-accesslog
  template:
    metadata:
      labels:
        app: vector-juicefs-accesslog
    spec:
      serviceAccountName: vector-juicefs
      tolerations:
        - operator: Exists
      containers:
        - name: reader
          image: python:3.12-slim
          command: ["python3", "-u", "/app/juicefs_accesslog_reader.py"]
          env:
            - name: READER_OUTPUT
              value: unix:/run/jfs-accesslog/reader.sock
            - name: MOUNT_PREFIXES
              value: /var/lib/juicefs/volume/
            # pid -> pod needs the host PID namespace view; mount pods need hostPID too
            # (k8s/csi-mountpod-hostpid.yaml), otherwise every pid is 0.
            - name: HOST_PROC
              value: /host/proc
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0  # ".accesslog" is 0400 root
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: reader
              mountPath: /app
            - name: jfs-volumes
              mountPath: /var/lib/juicefs/volume
              mountPropagation: HostToContainer
              readOnly: true
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: socket
              mountPath: /run/jfs-accesslog
        - name: vector
          image: timberio/vector:0.50.0-debian
          args: ["--config", "/etc/vector/vector.yaml", "--config", "/etc/vector/source-socket.yaml"]
          env:
            - name: KAFKA_BOOTSTRAP
              value: "172.30.0.2:9092"
            - name: KAFKA_TOPIC
              value: juicefs-accesslog
            - name: JUICEFS_TZ
              value: UTC
            - name: JFS_CLUSTER
              value: lab-k3s
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 9598
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: config
              mountPath: /etc/vector
            - name: socket
              mountPath: /run/jfs-accesslog
            - name: data
              mountPath: /var/lib/vector
      volumes:
        - name: config
          configMap:
            name: vector-juicefs-config
        - name: reader
          configMap:
            name: juicefs-accesslog-reader
        - name: jfs-volumes
          hostPath:
            path: /var/lib/juicefs/volume
            type: DirectoryOrCreate
        - name: host-proc
          hostPath:
            path: /proc
        - name: socket
          emptyDir: {}
        - name: data
          hostPath:
            path: /var/lib/vector-juicefs
            type: DirectoryOrCreate
