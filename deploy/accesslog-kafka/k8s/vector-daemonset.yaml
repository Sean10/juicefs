# Vector DaemonSet collecting the access log of every JuiceFS CSI mount pod on the node.
#
# Mount pods mount the volume on the host at /var/lib/juicefs/volume/<pv>-<random>
# (Bidirectional propagation), so this pod sees them through a HostToContainer hostPath
# and reads "<mount>/.accesslog" directly; no change to the mount pod is required.
# The vector-juicefs-config ConfigMap is generated by ../kustomization.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: juicefs-logging
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector-juicefs
  namespace: juicefs-logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector-juicefs
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector-juicefs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector-juicefs
subjects:
  - kind: ServiceAccount
    name: vector-juicefs
    namespace: juicefs-logging
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector-juicefs-accesslog
  namespace: juicefs-logging
  labels:
    app: vector-juicefs-accesslog
spec:
  selector:
    matchLabels:
      app: vector-juicefs-accesslog
  template:
    metadata:
      labels:
        app: vector-juicefs-accesslog
    spec:
      serviceAccountName: vector-juicefs
      tolerations:
        - operator: Exists
      containers:
        - name: vector
          image: timberio/vector:0.50.0-debian
          args: ["--config", "/etc/vector/vector.yaml"]
          env:
            - name: KAFKA_BOOTSTRAP
              value: "172.30.0.2:9092"
            - name: KAFKA_TOPIC
              value: juicefs-accesslog
            - name: JUICEFS_TZ
              value: UTC
            - name: JFS_CLUSTER
              value: lab-k3s
            - name: MOUNT_PREFIXES
              value: /var/lib/juicefs/volume/
            - name: HOST_PROC
              value: /host/proc
            - name: K8S_META_DIR
              value: /k8s-meta
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0
          ports:
            - name: metrics
              containerPort: 9598
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: config
              mountPath: /etc/vector
            - name: jfs-volumes
              mountPath: /var/lib/juicefs/volume
              mountPropagation: HostToContainer
              readOnly: true
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: k8s-meta
              mountPath: /k8s-meta
            - name: data
              mountPath: /var/lib/vector
        - name: k8s-meta
          image: alpine/kubectl:1.36.4
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                kubectl get pods -A --field-selector spec.nodeName="$NODE_NAME" \
                  -o jsonpath='{range .items[*]}{.metadata.uid}{"\t"}{.metadata.namespace}{"\t"}{.metadata.name}{"\n"}{end}' \
                  > /k8s-meta/pods.tsv.tmp && mv /k8s-meta/pods.tsv.tmp /k8s-meta/pods.tsv
                kubectl get pv \
                  -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.claimRef.namespace}{"\t"}{.spec.claimRef.name}{"\n"}{end}' \
                  > /k8s-meta/pvs.tsv.tmp && mv /k8s-meta/pvs.tsv.tmp /k8s-meta/pvs.tsv
                sleep 30
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - name: k8s-meta
              mountPath: /k8s-meta
      volumes:
        - name: config
          configMap:
            name: vector-juicefs-config
            defaultMode: 0755
        - name: jfs-volumes
          hostPath:
            path: /var/lib/juicefs/volume
            type: DirectoryOrCreate
        - name: host-proc
          hostPath:
            path: /proc
        - name: k8s-meta
          emptyDir: {}
        - name: data
          hostPath:
            path: /var/lib/vector-juicefs
            type: DirectoryOrCreate
