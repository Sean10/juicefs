# Weekly full file inventory of a JuiceFS volume, produced to Kafka.
#
# The dump runs against the metadata engine only (no mount needed). Create the secret
# first, e.g. from the CSI volume secret:
#   kubectl -n juicefs-logging create secret generic juicefs-inventory \
#     --from-literal=metaurl=redis://172.30.0.2:6379/3 --from-literal=volume=k8sfs
# The juicefs-inventory-scripts ConfigMap is generated by ../kustomization.yaml.
# Run once by hand: kubectl -n juicefs-logging create job --from=cronjob/juicefs-inventory inv-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: juicefs-inventory
  namespace: juicefs-logging
spec:
  schedule: "0 2 * * 0"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: dump
              image: juicedata/mount:ce-v1.4.0
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  /usr/local/bin/juicefs dump "$METAURL" --skip-trash --threads 10 \
                    | python3 /scripts/juicefs-inventory.py --volume "$VOLUME" -o /work/inventory.ndjson.gz
              env:
                - name: METAURL
                  valueFrom: {secretKeyRef: {name: juicefs-inventory, key: metaurl}}
                - name: VOLUME
                  valueFrom: {secretKeyRef: {name: juicefs-inventory, key: volume}}
              resources:
                requests: {cpu: 500m, memory: 512Mi}
              volumeMounts:
                - {name: scripts, mountPath: /scripts}
                - {name: work, mountPath: /work}
          containers:
            - name: produce
              image: edenhill/kcat:1.7.1
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  gzip -dc /work/inventory.ndjson.gz | kcat -P -b "$KAFKA_BOOTSTRAP" -t "$KAFKA_TOPIC" -z lz4 -X linger.ms=100
                  echo "produced $(gzip -dc /work/inventory.ndjson.gz | wc -l) records to $KAFKA_TOPIC"
              env:
                - name: KAFKA_BOOTSTRAP
                  value: "172.30.0.2:9092"
                - name: KAFKA_TOPIC
                  value: juicefs-inventory
              volumeMounts:
                - {name: work, mountPath: /work}
          volumes:
            - name: scripts
              configMap:
                name: juicefs-inventory-scripts
            - name: work
              emptyDir: {}
